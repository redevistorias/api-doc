x-webhooks:
  acceptedWebhook:
    post:
      summary: Accepted
      description: Este webhook é executado quando o pedido foi aceito.
      operationId: acceptedWebhook
      tags:
        - Webhook
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          description: "Assinatura HMAC-SHA256 do payload. Formato: sha256=<hash>. Valide usando sua api_key como secret."
          schema:
            type: string
          example: "sha256=a1b2c3d4e5f6..."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptedWebhook"
      responses:
        "200":
          description: "OK"
  finishedWebhook:
    post:
      summary: Finished
      description: Este webhook é executado quando a vistoria é executada e finalizada.
      operationId: finishedWebhook
      tags:
        - Webhook
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          description: "Assinatura HMAC-SHA256 do payload. Formato: sha256=<hash>. Valide usando sua api_key como secret."
          schema:
            type: string
          example: "sha256=a1b2c3d4e5f6..."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishedWebhook"
      responses:
        "200":
          description: "OK"
  rejectedWebhook:
    post:
      summary: Rejected
      description: Este webhook é executado quando, por razões diversas, o pedido foi rejeitado.
      operationId: rejectedWebhook
      tags:
        - Webhook
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          description: "Assinatura HMAC-SHA256 do payload. Formato: sha256=<hash>. Valide usando sua api_key como secret."
          schema:
            type: string
          example: "sha256=a1b2c3d4e5f6..."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectedWebhook"
      responses:
        "200":
          description: "OK"
  canceledWebhook:
    post:
      summary: Canceled
      description: Este webhook é executado quando, por razões diversas, o pedido foi cancelado após ter sido aceito.
