openapi: 3.0.0
info:
  description: |
    Esta é a documentação oficial da API pública da Rede Vistorias.

    Além do ambiente de produção, oferecemos um ambiente de testes (sandbox):
    - Produção: https://api.redevistorias.com.br/erp
    - Sandbox: https://api.sandbox.redevistorias.com.br/erp

    As rotas de autenticação, por sua vez, possuem sua própria URL, também possuindo ambientes de produção e sandbox:
    - Produção: https://auth.redevistorias.com.br
    - Sandbox: https://auth.sandbox.redevistorias.com.br

    ### Controle de Taxa de Requisições (Rate Limiting)

    Para garantir a estabilidade e a qualidade de serviço de nossos ambientes, a API implementa rate limiting por cliente (identificado via `oauth_client_id` / `oauth_user_id` e fallback para endereço IP).
    
    Todas as respostas da API contêm os seguintes cabeçalhos de controle:
    - `X-RateLimit-Limit`: Quantidade máxima de requisições permitidas na janela de tempo.
    - `X-RateLimit-Remaining`: Número de requisições restantes que podem ser feitas antes do término da janela atual.
    - `X-RateLimit-Reset`: Timestamp UTC (Unix epoch em segundos) indicando quando o contador de requisições será reiniciado.
    - `Retry-After`: Tempo de espera (em segundos) retornado caso o limite de requisições seja ultrapassado.

    Caso você atinja o limite máximo estabelecido, a API retornará o status HTTP `429 Too Many Requests`. Recomendamos adotar backoff exponencial e respeitar o tempo informado no cabeçalho `Retry-After`.
  version: "1.32"
  title: Rede Vistorias ERP API
  contact:
    email: integracao@redevistorias.com.br
  license:
    name: Apache 2.0
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
servers:
  - url: https://api.sandbox.redevistorias.com.br/erp
  - url: https://api.redevistorias.com.br/erp

tags:
  - name: Autenticação
    description: >-
      Para a integração de um serviço externo com a API da Rede Vistorias é
      necessária a utilização de uma API Key fornecida pelo usuário (ou
      adquirida no cadastro do cliente). Possuindo uma API Key é possível gerar
      um 'Bearer token' com validade de 24 horas, a contar do momento de sua geração. Este token é obrigatório em todos
      os requests na API da Rede Vistorias.
  - name: Pedidos
    description: >-
      A API da Rede Vistorias provê uma forma de serviços externos para realizar
      pedidos de vistorias. Todas alterações no pedido que sejam relevantes para
      o cliente serão notificadas por um webhook no endpoint informado no
      momento da geração da API Key. Cada webhook possui um formato específico
      para a ação que ele representa.
  - name: Orçamento
    description: >-
      A API da Rede Vistorias provê uma rota para simular o preço de uma
      vistoria.
  - name: Webhook
    description: |
      O serviço da Rede Vistorias utiliza webhooks para notificar a ferramenta de integração ou o sistema da imobiliária sobre qualquer alteração no ciclo de vida do pedido de vistoria.

      ### 1. Configuração de URL (Padrão vs. Por Imobiliária)

      A URL de destino dos webhooks pode ser configurada de duas maneiras:
      - **URL Padrão da Integração:** Uma URL única e centralizada para todos os clientes que utilizam o ERP/integração.
      - **URL Variável por Cliente/Imobiliária:** Cada imobiliária parceira pode definir sua própria URL de webhook diretamente no momento da ativação da integração em seu painel da Rede Vistorias (momento em que a sua API Key é gerada).

      ### 2. Override de Webhook por Pedido

      Ao criar um pedido (`POST /orders`), é possível informar opcionalmente os campos `webhook_url` e `webhook_secret` para direcionar as notificações **exclusivamente daquele pedido** para uma URL ou chave específica:
      - **Atenção (Regra de Omissão):** Caso o pedido utilize a mesma URL e secret padrão já configurados na integração ou no cadastro da imobiliária, **você deve omitir** as chaves `webhook_url` e `webhook_secret` do payload. Envie-as apenas quando for estritamente necessário substituir o destino padrão para aquele pedido específico.

      ### 3. Tabela de Eventos e Gatilhos

      Todos os webhooks enviam payloads no formato JSON via método `POST`. Abaixo estão os eventos emitidos e seus significados:

      | Evento | Status do Pedido | Descrição / Momento do Disparo |
      | :--- | :--- | :--- |
      | `order.created` | `ACCEPTED` | Emitido assim que o pedido é aprovado e aceito pela franquia responsável. |
      | `order.assigned` | `ACCEPTED` | Emitido quando um vistoriador é atribuído e a data/horário é agendada para execução. |
      | `order.finished` | `FINISHED` | Emitido quando a vistoria é concluída, com laudos e links finais disponíveis. |
      | `order.rejected` | `REJECTED` | Emitido quando o pedido não pode ser atendido pela franquia e é recusado. |
      | `order.canceled` | `CANCELED` | Emitido quando um pedido já aceito é cancelado (via integração ou franquia). *(Nota: exclusão de pedidos em `WAITING` não dispara webhook).* |
      | `order.divergence.created` | `FINISHED` | Emitido quando uma contestação/divergência de laudo é apontada. |
      | `order.divergence.waiting_client` | `FINISHED` | Emitido quando a análise da contestação é realizada e aguarda aprovação da imobiliária. |
      | `order.divergence.finished` | `FINISHED` | Emitido quando a análise da contestação é concluída e o relatório final fica disponível. |

      ### 4. Autenticação e Segurança (HMAC-SHA256)

      Todas as requisições de webhook enviadas pela Rede Vistorias incluem o cabeçalho HTTP:
      ```http
      X-Webhook-Signature: sha256=<hash>
      ```

      - **Chave Secreta (Secret):** Por padrão, a assinatura é gerada utilizando a `api_key` da integração/imobiliária como secret (ou o `webhook_secret`, caso tenha sido informado override no pedido).
      - **Algoritmo:** HMAC com algoritmo SHA-256.

      #### Como Validar a Assinatura (Exemplo em Python):
      > **Importante:** Sempre utilize o corpo bruto da requisição (**raw request body**) como bytes para o cálculo do hash, antes de qualquer parsing ou deserialização JSON.

      ```python
      import hmac
      import hashlib

      # 1. Recupera a assinatura do cabeçalho
      signature_header = request.headers.get('X-Webhook-Signature', '')
      signature = signature_header.replace('sha256=', '')

      # 2. Secret: api_key da integração (ou webhook_secret do override)
      secret = api_key.encode('utf-8')

      # 3. Calcula o HMAC com os bytes brutos do corpo da requisição (raw body)
      expected_signature = hmac.new(
          secret,
          request.body,  # raw bytes
          hashlib.sha256
      ).hexdigest()

      # 4. Comparação em tempo constante para evitar timing attacks
      is_valid = hmac.compare_digest(expected_signature, signature)
      if not is_valid:
          raise PermissionError("Assinatura de webhook inválida!")
      ```

      ### 5. Boas Práticas para o Integrador

      - **Resposta Rápida (HTTP 200 OK):** Seu endpoint deve responder com status `200 OK` assim que receber o webhook, antes de processar tarefas pesadas de banco de dados ou download de fotos. Processe o payload de forma assíncrona (em background / filas) para evitar timeout.
      - **Idempotência:** Como webhooks podem sofrer retentativas automáticas em caso de instabilidade na rede, certifique-se de que seu endpoint processe o mesmo evento (`code` + `event`) de forma idempotente sem duplicar registros.
  - name: Upload URL
    description: >-
      A API da Rede Vistorias provê uma rota para upload de arquivos em nossa plataforma,
      utilizada quando uma vistoria requer uma anterior (caso das vistorias de saída e conferência),
      podendo ser feito esse upload.
  - name: Unidades
    description: >-
      A API da Rede Vistorias provê uma rota para recuperar as unidades com as quais o cliente possui vínculo.
      Esta informação (valor inteiro e que, na listagem, se chama "id") deverá ser utilizada na geração de pedido, caso queira identificar 
      a qual unidade aquele pedido pertencerá (franchisee_id).
  - name: Recursos
    description: >-
      A API da Rede Vistorias provê rotas para solicitar e acessar recursos e relatórios gerados a partir de uma vistoria realizada.
  - name: Clientes
    description: |
      Cadastro de clientes na plataforma da Rede Vistorias.

      > **Atenção:** Normalmente, a imobiliária parceira já possui cadastro ativo na Rede Vistorias e utiliza diretamente sua `api_key` para a integração de pedidos. O cadastro via API é um fluxo destinado a casos específicos previamente alinhados. Clientes cadastrados por este endpoint são criados sem vínculo com uma unidade (franquia), sendo necessária a configuração posterior desse vínculo pela equipe da Rede Vistorias para que qualquer vistoria possa ser executada.
  - name: Simulação de Webhook (Sandbox)
    description: |
      Endpoints dedicados para testes em **ambiente Sandbox** (ou de desenvolvimento). Permite que integradores solicitem o disparo manual de eventos de webhook para seus pedidos, facilitando testes de fluxo e recepção de notificações sem a necessidade de intervenção operacional manual.

      > **Atenção:** Esta rota é terminantemente desabilitada em ambiente de produção (retornará `HTTP 403 Forbidden`).

      #### Regras de Transição de Estado:
      | Evento | Pré-requisito do Pedido | Descrição / Efeito |
      | :--- | :--- | :--- |
      | `ACCEPTED` | Status deve estar em `WAITING` | Aprova o pedido, marcando status como `ACCEPTED` e disparando evento `order.accepted`. |
      | `REJECTED` | Status deve estar em `WAITING` | Rejeita o pedido, marcando status como `REJECTED` e disparando evento `order.rejected`. |
      | `ASSIGNED` | Status deve estar em `ACCEPTED` | Atribui vistoriador, agenda a vistoria e enfileira evento `inspection.assign` (dispara webhook `inspection.assigned`). |
      | `CANCELED` | Status em `WAITING` ou `ACCEPTED` | Cancela o pedido, desvincula vistorias e dispara webhook `order.canceled`. |
      | `FINISHED` | Status em `ACCEPTED` | Finaliza a vistoria com dados e fotos no S3 (conforme modalidade `entrada`, `saida` ou `conferencia`), define status como `FINISHED` e dispara webhook `order.finished`. Auto-atribui vistoriador caso ainda não atribuído. |
      | `DIVERGENCE_CREATED` | Status deve estar em `FINISHED` | Cria apontamento de contestação do laudo e dispara webhook `order.divergence.created`. |
      | `DIVERGENCE_WAITING_CLIENT` | Status deve estar em `FINISHED` | Atualiza contestação com parecer da franqueadora e dispara webhook `order.divergence.waiting_client`. |
      | `DIVERGENCE_FINISHED` | Status deve estar em `FINISHED` | Conclui contestação com parecer do cliente e dispara webhook `order.divergence.finished`. |
paths:
  /token:
    post:
      tags:
        - Autenticação
      summary: Gera o token de acesso
      description: |
        ![Diagrama de sequencia do processo de adquirir um token baseado em uma api key](../images/apikey_authorization.jpg)

        Esta requisição aceita dois tipos de "grant_type":
        - **api_key**: O token gerado neste tipo de requisição é utilizado para
        fazer novos pedidos na API (utilizado nas requisições de Pedidos ou
        Price Preview)
        - **client_credentials**: Utilizado para cadastrar novos clientes e
        integrações em nossa API.
      operationId: generateToken
      servers:
        - url: https://auth.sandbox.redevistorias.com.br
        - url: https://auth.redevistorias.com.br
      requestBody:
        description: Parâmetros para solicitação de token de acesso via formulário urlencoded.
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/APIKeyGrant"
                - $ref: "#/components/schemas/ClientCredentialsGrant"
            examples:
              apiKeyGrant:
                summary: Autenticação via API Key (Pedidos e Orçamentos)
                description: Utilizado para gerar token de acesso para operações de pedidos ou consulta de preços em nome do cliente.
                value:
                  grant_type: api_key
                  client_id: erpfoo
                  client_secret: B8WbfvPVX1ic
                  api_key: ZAltqyeoXLlZLR6N9QP0QfyE7asIz65wZ8eBfBDr8o7W4dk9W93beJy0rZleOgQmmkm4jkkW54kv7dxh
              clientCredentialsGrant:
                summary: Autenticação via Client Credentials (Novos Clientes)
                description: Utilizado para cadastrar novos clientes e integrações na API.
                value:
                  grant_type: client_credentials
                  client_id: erpfoo
                  client_secret: B8WbfvPVX1ic
                  scope: client:create
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/APIKeyResponse"
                  - $ref: "#/components/schemas/ClientCredentialsResponse"
              examples:
                apiKeyResponse:
                  summary: Resposta para grant_type api_key
                  value:
                    token_type: Bearer
                    expires_in: 86400
                    access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9...
                    refresh_token: def50200f44a3a36b5...
                clientCredentialsResponse:
                  summary: Resposta para grant_type client_credentials
                  value:
                    token_type: Bearer
                    expires_in: 86400
                    access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9...
        "401":
          description: Unauthorized
  /orders/upload_url:
    get:
      tags:
        - Upload URL
      summary: Gera uma URL assinada no S3
      description: >-
        Utilizando esta rota, é possível conseguir a URL para upload de um arquivo
        na nossa plataforma, associando este arquivo a um remote-name, utilizado por outras
        rotas. Assim, é possível efetuar o upload na plataforma da S3, fazendo uma requisição do tipo
        PUT na URL gerada, e passando o arquivo na requisição. Maiores informações podem ser obtidas
        na <a href="https://docs.aws.amazon.com/pt_br/AmazonS3/latest/dev/PresignedUrlUploadObject.html" target="_blank">documentação da Amazon</a>.
      operationId: uploadURL
      parameters:
        - in: header
          name: Authorization
          required: true
          example: Bearer eyJ0eXAiOiJKV1QiL...
          schema:
            type: string
      responses:
        "200":
          description: Generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  remote_name:
                    type: string
                    example: 75300A80-2E79-492F-8B3F-4B6239D1319F\/ABD57818-40FE-11E9-A15D-02420A00001D
                  url:
                    type: string
                    example: https:\/\/s3.amazonaws.com\/upload.dev.redevistorias.com.br\/75300A80-2E79-492F-8B3F-4B6239D1319F\/ABD57818-40FE-11E9-A15D-02420A00001D?...
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Error trying to generate the signed URL. If this problem persists, please inform the administrator"
  /orders:
    post:
      tags:
        - Pedidos
      summary: Cadastra um novo pedido de vistoria na API da Rede Vistorias.
      description:
        O retorno é o código cadastrado da vistoria, e o preço que será consumido do pacote contratado pelo cliente, em créditos.<br />
        No caso do pedido de saída ou de conferência, deve ser informada a inspeção anterior. Isto pode ser feito de duas formas, fazendo o upload
        de um arquivo (ver <a href="#tag/Upload-URL">Upload URL</a>) ou informando um link já existente, que será processado por nossa plataforma.
        Para pedidos de aditivo, deve-se obrigatoriamente informar apenas o código do pedido anterior, sendo ele um pedido de entrada ou um outro
        pedido de aditivo.<br /><br />
        <strong>Override de webhook:</strong> É possível informar opcionalmente os campos <code>webhook_url</code> e <code>webhook_secret</code>
        para que todas as notificações deste pedido específico sejam enviadas para uma URL customizada, assinadas com o secret informado.
        Quando presentes, os hooks padrão da integração são ignorados para este pedido.
        <em>Atenção:</em> Caso este pedido utilize a mesma URL e secret padrão já configurados na integração ou no cadastro da imobiliária, <strong>omita</strong> estes campos do payload.
      operationId: addPedido
      parameters:
        - in: header
          name: Authorization
          required: true
          example: Bearer eyJ0eXAiOiJKV1QiL...
          schema:
            type: string
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: PVLE.987.00125
                    description: Código de identificação da vistoria.
                  price:
                    type: string
                    example: "85.50"
                    description: Preço a pagar pela vistoria.
        "400":
          description: Bad request.
        "401":
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/PedidoEntrada"
                - $ref: "#/components/schemas/PedidoSaida"
                - $ref: "#/components/schemas/PedidoConferencia"
                - $ref: "#/components/schemas/PedidoTransferencia"
                - $ref: "#/components/schemas/PedidoFotosCaptacao"
                - $ref: "#/components/schemas/PedidoAditivo"
                - $ref: "#/components/schemas/PedidoTourVirtual"
                - $ref: "#/components/schemas/PedidoInventario"
        required: true
  /orders/{code}:
    delete:
      tags:
        - Pedidos
      summary: Cancelar ou excluir um pedido.
      description: |
        Cancela ou exclui um pedido de vistoria solicitado.<br />
        - **Pedidos no status WAITING (recém-solicitados):** O pedido é cancelado/excluído do sistema e os créditos consumidos são estornados. O webhook de cancelamento não é disparado nesse caso.
        - **Pedidos no status ACCEPTED (aceitos pela franquia, antes da atribuição de vistoriador):** O pedido tem seu status alterado para `CANCELED` e os créditos consumidos são estornados integralmente sem cobrança de taxa de cancelamento. O webhook de cancelamento (`order.canceled`) é disparado.
        <br />
        Obs.: Caso o pedido já possua vistoriador atribuído, já esteja em andamento, já tenha sido finalizado ou já esteja cancelado, o cancelamento não será permitido e retornará erro 400 com o código do motivo correspondente.
      operationId: deleteOrder
      parameters:
        - in: header
          name: Authorization
          required: true
          example: Bearer eyJ0eXAiOiJKV1QiL...
          schema:
            type: string
        - in: path
          name: code
          required: true
          example: PVLE.987.00125
          schema:
            type: string
          description: Código do pedido a ser cancelado.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: "Cliente desistiu da vistoria"
                  description: Motivo opcional para exclusão/cancelamento do pedido.
      responses:
        "204":
          description: Pedido cancelado ou excluído com sucesso.
        "400":
          description: |
            Bad request. O pedido não está em um estado que permite cancelamento (deve estar em WAITING ou em ACCEPTED sem agendamento/vistoriador atribuído).
            Possíveis erros:
            - `ORDER_ALREADY_ASSIGNED`: O pedido já possui um vistoriador atribuído.
            - `ORDER_IN_PROGRESS`: A vistoria já foi recebida pelo vistoriador.
            - `ORDER_ALREADY_FINALIZED`: A vistoria já foi realizada.
            - `ORDER_VNR`: O pedido foi marcado como vistoria não realizada (VNR).
            - `ORDER_ALREADY_FINISHED`: O pedido já está finalizado.
            - `ORDER_ALREADY_CANCELED`: O pedido já foi cancelado anteriormente.
            - `INVALID_ORDER_STATUS`: O pedido está em um status que não permite cancelamento pelo cliente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "ORDER_ALREADY_ASSIGNED"
        "401":
          description: Unauthorized.
        "404":
          description: Pedido não encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "ORDER_NOT_FOUND"
  /price_preview:
    post:
      tags:
        - Orçamento
      summary: Permite verificar o preço da vistoria.
      description: Este preço é o crédito que será consumido do pacote contratado pelo cliente, em créditos.
      operationId: addPricePreview
      parameters:
        - in: header
          name: Authorization
          required: true
          example: Bearer eyJ0eXAiOiJKV1QiL...
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  price:
                    type: string
                    example: "85.50"
                    description: O preço da vistoria.
        "400":
          description: Bad request.
        "401":
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricePreview"
        required: true
  /orders/{code}/simulate-webhook:
    post:
      tags:
        - Simulação de Webhook (Sandbox)
      summary: Solicitar simulação de disparo de webhook (Apenas Sandbox).
      description: |
        Dispara a transição de estado de um pedido e a emissão do webhook correspondente no ambiente **Sandbox** ou Dev.
        A resposta é processada de forma assíncrona, retornando `HTTP 202 Accepted` acompanhado dos eventos disparados no broker.
        <br/><br/>
        **Restrições:**
        - Esta funcionalidade **não funciona em produção** (retorna `403 Forbidden`).
        - O pedido deve pertencer à mesma imobiliária/cliente associado à credencial de acesso (caso contrário retorna `403 Forbidden`).
        - O pedido deve estar no status pré-requisito do evento solicitado (caso contrário retorna `422 Unprocessable Entity`).
      operationId: simulateOrderWebhook
      parameters:
        - in: header
          name: Authorization
          required: true
          example: Bearer eyJ0eXAiOiJKV1QiL...
          schema:
            type: string
        - in: path
          name: code
          required: true
          example: PVLE.987.00125
          schema:
            type: string
          description: Código do pedido para o qual o webhook será simulado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
              example:
                event: "ACCEPTED"
              properties:
                event:
                  type: string
                  enum:
                    - ACCEPTED
                    - ASSIGNED
                    - FINISHED
                    - CANCELED
                    - REJECTED
                    - DIVERGENCE_CREATED
                    - DIVERGENCE_WAITING_CLIENT
                    - DIVERGENCE_FINISHED
                  example: "ACCEPTED"
                  description: Evento de ciclo de vida que se deseja simular.
                inspector_public_id:
                  type: string
                  nullable: true
                  example: "00000000-0000-0000-0000-000000000001"
                  description: Public ID do vistoriador cadastrado na franquia (usado em ASSIGNED e FINISHED).
                inspector_name:
                  type: string
                  nullable: true
                  example: "Carlos Vistoriador"
                  description: Nome do vistoriador simulado (usado em ASSIGNED).
                scheduled_date:
                  type: string
                  nullable: true
                  example: "2026-10-30"
                  description: Data agendada para a vistoria YYYY-MM-DD (usado no evento ASSIGNED).
                start_time:
                  type: string
                  nullable: true
                  example: "09:00"
                  description: Horário de início previsto (formato HH:MM).
                end_time:
                  type: string
                  nullable: true
                  example: "10:00"
                  description: Horário de término previsto (formato HH:MM).
                flextime:
                  type: boolean
                  nullable: true
                  example: false
                  description: Indica se a vistoria possui horário flexível.
                message:
                  type: string
                  nullable: true
                  example: "Vistoria agendada para período matutino."
                  description: Mensagem adicional exibida no histórico de agendamento.
                party:
                  type: string
                  enum:
                    - TENANT
                    - OWNER
                    - inquilino
                    - proprietario
                  default: "TENANT"
                  example: "TENANT"
                  description: Parte solicitante da contestação (usado nos eventos DIVERGENCE_*).
                responsible_name:
                  type: string
                  nullable: true
                  example: "João Silva"
                  description: Nome do responsável pelo feedback da contestação.
                responsible_email:
                  type: string
                  nullable: true
                  example: "joao.silva@email.com"
                  description: E-mail do responsável pelo feedback da contestação.
                item_index:
                  type: string
                  nullable: true
                  example: "1.1"
                  description: Índice do cômodo/item da vistoria contestado (usado nos eventos DIVERGENCE_*).
                description:
                  type: string
                  nullable: true
                  example: "Pintura com manchas na parede da sala."
                  description: Texto descritivo do apontamento de divergência.
                cancel_reason:
                  type: string
                  nullable: true
                  example: "Cancelamento solicitado para testes de homologação"
                  description: Motivo do cancelamento (gravado no histórico e enviado no webhook order.canceled).
                cancel_should_be_charged:
                  type: boolean
                  nullable: true
                  example: false
                  description: Indica se o cancelamento deve cobrar taxa (se true, calcula créditos pela taxa de cancelamento; se false, zera os créditos do pedido).
                cancel_fee:
                  type: number
                  format: float
                  nullable: true
                  example: 50.0
                  description: Valor customizado da taxa de cancelamento em R$ (utilizado quando cancel_should_be_charged é true).
            examples:
              accepted:
                summary: "ACCEPTED (Pedido Aprovado)"
                description: "Aprova o pedido que está em WAITING."
                value:
                  event: "ACCEPTED"
              assigned:
                summary: "ASSIGNED (Vistoria Agendada)"
                description: "Agenda a vistoria para um vistoriador com data e horário definidos."
                value:
                  event: "ASSIGNED"
                  inspector_name: "Carlos Vistoriador"
                  scheduled_date: "2026-10-30"
                  start_time: "09:00"
                  end_time: "10:00"
                  flextime: false
              finished:
                summary: "FINISHED (Laudo Concluído)"
                description: "Finaliza a vistoria e gera o laudo. O vistoriador é auto-atribuído se ainda não definido."
                value:
                  event: "FINISHED"
              canceled:
                summary: "CANCELED (Pedido Cancelado)"
                description: "Cancela o pedido em WAITING ou ACCEPTED."
                value:
                  event: "CANCELED"
              rejected:
                summary: "REJECTED (Pedido Rejeitado)"
                description: "Rejeita o pedido que está em WAITING."
                value:
                  event: "REJECTED"
              divergenceCreated:
                summary: "DIVERGENCE_CREATED (Contestação Criada)"
                description: "Registra uma nova contestação de item de vistoria."
                value:
                  event: "DIVERGENCE_CREATED"
                  party: "TENANT"
                  responsible_name: "João Silva"
                  responsible_email: "joao.silva@email.com"
                  item_index: "1.1"
                  description: "Pintura com manchas na parede da sala."
              divergenceWaitingClient:
                summary: "DIVERGENCE_WAITING_CLIENT (Aguardando Cliente)"
                description: "Atualiza contestação com parecer da franqueadora."
                value:
                  event: "DIVERGENCE_WAITING_CLIENT"
                  party: "TENANT"
              divergenceFinished:
                summary: "DIVERGENCE_FINISHED (Contestação Concluída)"
                description: "Conclui a contestação com parecer favorável do cliente."
                value:
                  event: "DIVERGENCE_FINISHED"
                  party: "TENANT"
      responses:
        "202":
          description: Solicitação de simulação aceita.
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulated_event:
                    type: string
                    example: "ACCEPTED"
        "400":
          description: "Requisição inválida (ex: payload sem 'event' ou evento desconhecido)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "EVENT_REQUIRED"
        "403":
          description: Acesso proibido. A simulação foi solicitada no ambiente de Produção ou o pedido pertence a outro cliente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "A simulação de webhooks só é permitida em ambiente Sandbox ou Develop."
        "404":
          description: Pedido não encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "ORDER_NOT_FOUND"
        "422":
          description: Não processável. O pedido não está no status requerido para essa transição ou dados inválidos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "SIMULATION_INVALID_TRANSITION"
        "429":
          description: Too Many Requests. Limite de requisições da API foi atingido.
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: Limite de requisições na janela atual.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Quantidade de requisições restantes.
            X-RateLimit-Reset:
              schema:
                type: integer
              description: Timestamp UTC de expiração da janela atual.
            Retry-After:
              schema:
                type: integer
              description: Quantidade de segundos a esperar antes de nova tentativa.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Too many requests"
  /orders/{code}/resources:
    get:
      tags:
        - Recursos
      summary: Acessa recursos fornecidos pela vistoria.
      description: |
        Essa requisição é assíncrona e seu resultado é enviado para a URL de webhook cadastrada para o cliente.<br />
         ```
         {
           "code": "PVLE.987.00125",
           "status": "FINISHED",
           "building_id": "Ed. Itacorubi II - Bl 8 Apt 301",
           "trace_data": [],
           "resources": [
             {
               "type": "raw_data",
               "file_url": "https://s3.amazonaws.com/vistorias.dev.redevistorias.com.br/75300A80-2E79-492F-8B3F-4B6239D1319F/75300A80-2E79-492F-8B3F-4B6239D1319F/C5286172-7DFA-11EC-A1FD-0242AC120003/Extras/raw_data_1661972978.json?signature"
             }
           ]
         }
         ```
      operationId: accessOrderResource
      parameters:
        - name: Authorization
          in: header
          required: true
          example: Bearer eyJ0eXAiOiJKV1QiL...
          schema:
            type: string
        - name: code
          in: path
          required: true
          example: PVLE.987.00125
          schema:
            type: string
          description: Código do pedido de vistoria.
        - name: type
          in: query
          description: Identificação do tipo de recurso a ser acessado. Atualmente suporta exclusivamente 'raw_data' (dados brutos da vistoria).
          example: "raw_data"
          required: true
          style: form
          schema:
            type: string
            enum:
              - raw_data
      responses:
        "202":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Bad request.
        "401":
          description: Unauthorized
  /franchisees:
    get:
      tags:
        - Unidades
      summary: Recebe uma lista das unidades com as quais o cliente possui vínculo
      description: >-
        O retorno é uma lista de unidades, contendo os params "id" e "name", de forma a facilitar a identificação 
        de qual unidade se deseja inserir no pedido (franchisee_id).
      operationId: getFranchisees
      parameters:
        - in: header
          name: Authorization
          required: true
          example: Bearer eyJ0eXAiOiJKV1QiL...
          schema:
            type: string
      responses:
        "200":
          description: Lista de unidades com as quais o cliente possui vínculo.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 12
                      description: Código identificador da unidade (franchisee_id).
                    name:
                      type: string
                      example: Unidade Rede Vistorias
                      description: Nome da unidade/franquia.
        "400":
          description: Bad Request
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Couldn't find franchisees"
  /clients:
    post:
      tags:
        - Clientes
      summary: Cadastra um novo cliente na API da Rede Vistorias
      description: |
        Cadastra um novo cliente na plataforma da Rede Vistorias.

        > **Fluxo de Uso Específico:** Normalmente, as imobiliárias e parceiros já possuem cadastro prévio na Rede Vistorias e utilizam sua API Key para solicitar vistorias.
        > A criação de clientes via integração é destinada apenas a cenários específicos previamente acordados. Clientes cadastrados por esta rota são criados **sem franquia vinculada**; portanto, nenhuma vistoria poderá ser realizada para eles até que o vínculo com a franquia responsável seja configurado pela equipe da Rede Vistorias.

        Novos clientes podem ser cadastrados passando os dados informados abaixo.
        ![Diagrama de criação do cliente através da API](../images/new_client.jpg)
        <br />Todavia, caso o cliente já exista em nosso banco de dados, um erro de conflito (409) será retornado.
      operationId: addNaturalPerson
      parameters:
        - in: header
          name: Authorization
          required: true
          example: Bearer eyJ0eXAiOiJKV1QiL...
          schema:
            type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key:
                    type: string
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "409":
          description: Already existing client
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ClientPessoaFisica"
                - $ref: "#/components/schemas/ClientPessoaJuridica"
        description: >-
          A API da Rede Vistorias provê uma forma de serviços externos para adicionar
          novos clientes no sistema. Este cliente pode ser tanto uma pessoa
          física quanto uma pessoa jurídica. No caso do cliente ser pessoa
          jurídica, é necessário também informar os dados do responsável na
          empresa - seu documento, nome, contato e endereço.
        required: true
components:
  schemas:
    AcceptedWebhook:
