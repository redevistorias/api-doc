    AccompaniedInspection:
      type: object
      description: >-
        Dados para agendamento da vistoria acompanhada. Utilize este objeto quando houver alguém (como inquilino, proprietário ou outro responsável) no imóvel para acompanhar o vistoriador.
      properties:
        is_accompanied:
          type: boolean
          example: true
          description: >-
            Informa se a vistoria será acompanhada presencialmente no imóvel.
            - `true`: Vistoria acompanhada. Requer o preenchimento de `schedule_date` com a data e hora do agendamento, além dos dados do acompanhante (`companion_name` e `companion_contact`).
            - `false`: Vistoria não acompanhada (padrão). O vistoriador retira as chaves conforme as instruções de acesso e executa a vistoria dentro da sua grade de atendimento a partir da liberação do imóvel (`allowed_at_date`).
        companion_name:
          type: string
          example: José da Silva
          description: Nome completo da pessoa que irá receber ou acompanhar o vistoriador no imóvel.
        companion_contact:
          type: string
          example: "(48) 98765-4321"
          description: Telefone ou WhatsApp de contato com DDD da pessoa que irá acompanhar a vistoria.
        schedule_date:
          type: string
          example: "2026-11-15 14:00:00"
          description: >-
            Data e hora exata combinada para o acompanhamento presencial da vistoria no imóvel (formato `YYYY-MM-DD HH:mm:ss`).
    Recommendation:
      type: object
      description: >-
        Destinado a código de recomendação/indicação. Este campo é totalmente opcional e, na imensa maioria dos casos,
        o objeto 'recommendation' e suas chaves devem ser simplesmente omitidos do payload.
        ATENÇÃO: Caso seja informado um código inválido ou inexistente, a solicitação de pedido será bloqueada com erro.
      properties:
        code:
          type: string
          example: RVPROMO123
          description: Código de recomendação/indicação. Se desconhecido ou inexistente, omita esta chave.
