        price:
          type: string
          example: "75.00"
          description: Preço temporário
        allowed_at_date:
          type: string
          example: "2026-11-15 08:00:00"
          description: >-
            Data e hora a partir da qual o imóvel estará liberado e acessível para a realização da vistoria (formato `YYYY-MM-DD HH:mm:ss`).
                AVISO: Este campo NÃO representa um agendamento de horário com o vistoriador; ele apenas sinaliza à unidade a data inicial em que as chaves estarão disponíveis ou o imóvel desocupado. Caso não seja informado, considera-se que o imóvel já se encontra liberado imediatamente. Para marcar um horário fixo de encontro presencial com alguém no imóvel, utilize 'accompanied_inspection'. (formato `YYYY-MM-DD HH:mm:ss`).
            Enviado somente quando a data de liberação estiver definida no pedido;
            caso contrário, o campo é omitido.
        accompanied_inspection:
          allOf:
            - $ref: "#/components/schemas/AccompaniedInspection"
          description: >-
            Dados do acompanhamento da vistoria. Enviado somente quando o acompanhamento
            estiver definido no pedido; caso contrário, o campo é omitido.
