        event:
          type: string
          example: order.created
          description: Nome do evento do webhook
        code:
          type: string
          example: PVLE.987.00125
          description: Código do pedido
        status:
          type: string
          example: ACCEPTED
          description: Estado do pedido
        building_id:
          type: string
          example: Apt 203 - Ed Atol das Rocas
          description: Identificação do imóvel.
        inspection_type:
          type: string
          example: entrada
